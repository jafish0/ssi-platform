<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>layer-fireflies</title>
  <desc>Glowing motes along the banks. Pair with motion.css (.fly / .fly-core / .fly-glow) to drift and blink. Screen-blend for the warmest result.</desc>
  <defs>
    <radialGradient id="flyGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0bd" stop-opacity="0.8"></stop>
      <stop offset="0.4" stop-color="#ffcf7a" stop-opacity="0.34"></stop>
      <stop offset="1" stop-color="#ffbe63" stop-opacity="0"></stop>
    </radialGradient>
  </defs>
  <g id="layer-fireflies">
    <g class="fly" style="transform-origin:150px 1330px;animation-duration:10.1s;animation-delay:-1.9s">
      <circle class="fly-glow" cx="150" cy="1330" r="41" fill="url(#flyGlow)" opacity="0.75" style="animation-duration:2.81s;animation-delay:-1.03s"></circle>
      <circle class="fly-core" cx="150" cy="1330" r="5.8" fill="#fff6d6" opacity="0.9" style="animation-duration:2.81s;animation-delay:-1.03s"></circle>
    </g>
    <g class="fly fly--b" style="transform-origin:268px 1252px;animation-duration:10.3s;animation-delay:-2.1s">
