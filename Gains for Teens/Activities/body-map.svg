<svg xmlns="http://www.w3.org/2000/svg" id="bodyMap" viewBox="0 0 700 780" width="700" height="780" role="img" aria-label="Upper-body map with five tappable regions: head, lungs, heart, stomach and arm">

<style>
  .region { cursor: pointer; -webkit-tap-highlight-color: transparent; }

  .region .target {
    fill: #334155; fill-opacity: .04;
    stroke: #334155; stroke-opacity: .32; stroke-width: 1.6; stroke-dasharray: 5 5;
    transform-box: fill-box; transform-origin: center;
    transition: fill .3s ease, fill-opacity .3s ease, stroke .3s ease,
                stroke-opacity .3s ease, stroke-width .3s ease;
    animation: idlePulse 2.6s ease-in-out infinite;
  }
  .region .icon {
    fill: none; stroke: #334155; stroke-opacity: .5; stroke-width: 3.2;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .3s ease, stroke-opacity .3s ease, stroke-width .3s ease;
    animation: idleIcon 2.6s ease-in-out infinite;
  }
  .region .check { opacity: 0; transition: opacity .25s ease; }

  #region-head    .target, #region-head    .icon { animation-delay: 0s; }
  #region-lungs   .target, #region-lungs   .icon { animation-delay: .35s; }
  #region-heart   .target, #region-heart   .icon { animation-delay: .7s; }
  #region-stomach .target, #region-stomach .icon { animation-delay: 1.05s; }
  #region-body    .target, #region-body    .icon { animation-delay: 1.4s; }

  @keyframes idlePulse {
    0%, 100% { transform: scale(1);    stroke-opacity: .32; }
    50%      { transform: scale(1.07); stroke-opacity: .6;  }
  }
  @keyframes idleIcon {
    0%, 100% { stroke-opacity: .5; }
    50%      { stroke-opacity: .8; }
  }

  .region:hover .target { fill-opacity: .11; stroke-opacity: .55; }
  .region:hover .icon { stroke-opacity: .85; }

  .region.active .target {
    fill: #F59E0B; fill-opacity: .22;
    stroke: #F59E0B; stroke-opacity: .95; stroke-width: 2.6; stroke-dasharray: none;
    filter: url(#amberGlow);
    animation: none; transform: scale(1);
  }
  .region.active .icon { stroke: #B45309; stroke-opacity: 1; stroke-width: 3.6; animation: none; }

  .region.selected .target {
    fill: #F59E0B; fill-opacity: .4;
    stroke: #B45309; stroke-opacity: 1; stroke-width: 3; stroke-dasharray: none;
    animation: none; transform: scale(1);
  }
  .region.selected .icon { stroke: #78350F; stroke-opacity: 1; stroke-width: 3.6; animation: none; }
  .region.selected .check { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .region .target, .region .icon { animation: none; }
  }
</style>

<defs>
  <filter id="amberGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"></feGaussianBlur>
    <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.62  0 0 0 0 0.04  0 0 0 0.75 0" result="g"></feColorMatrix>
    <feMerge><feMergeNode in="g"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
  </filter>
</defs>

<g id="body-base" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M350,44 C394,44 420,79 420,124 C420,152 413,171 404,186 C395,202 378,216 350,216 C322,216 305,202 296,186 C287,171 280,152 280,124 C280,79 306,44 350,44 Z" fill="#334155" fill-opacity="0.045"></path>
  <path d="M281,120 C272,118 268,126 271,136 C274,146 281,148 284,145" stroke-width="3.4"></path>
  <path d="M419,120 C428,118 432,126 429,136 C426,146 419,148 416,145" stroke-width="3.4"></path>

  <path d="M322,198 C318,228 314,246 304,258 C266,268 232,280 214,302 C222,324 232,338 244,350 C250,394 254,432 256,472 C258,508 252,542 248,574 C244,608 246,642 248,700 L452,700 C454,642 456,608 452,574 C448,542 442,508 444,472 C446,432 450,394 456,350 C468,338 478,324 486,302 C468,280 434,268 396,258 C386,246 382,228 378,198 Z" fill="#334155" fill-opacity="0.045"></path>

  <path d="M214,302 C192,314 180,340 176,372 C170,412 165,452 160,492 C155,530 150,568 146,604 C143,626 138,646 139,664 C140,684 146,700 154,708 C159,713 167,711 169,703 C171,694 169,684 170,674 C172,660 178,650 182,638 C186,620 190,600 194,578 C200,540 208,498 214,456 C220,414 228,376 244,350 C232,338 222,324 214,302 Z" fill="#334155" fill-opacity="0.045"></path>
  <path d="M141,652 C152,644 164,640 176,642" stroke-width="3"></path>
  <path d="M147,703 C150,690 151,678 150,666" stroke-width="2.8"></path>
  <path d="M158,709 C161,696 162,684 161,672" stroke-width="2.8"></path>
  <path d="M170,674 C175,668 179,658 180,648" stroke-width="2.8"></path>

  <path d="M486,302 C508,314 520,340 524,372 C530,412 535,452 540,492 C545,530 550,568 554,604 C557,626 562,646 561,664 C560,684 554,700 546,708 C541,713 533,711 531,703 C529,694 531,684 530,674 C528,660 522,650 518,638 C514,620 510,600 506,578 C500,540 492,498 486,456 C480,414 472,376 456,350 C468,338 478,324 486,302 Z" fill="#334155" fill-opacity="0.045"></path>
  <path d="M559,652 C548,644 536,640 524,642" stroke-width="3"></path>
  <path d="M553,703 C550,690 549,678 550,666" stroke-width="2.8"></path>
  <path d="M542,709 C539,696 538,684 539,672" stroke-width="2.8"></path>
  <path d="M530,674 C525,668 521,658 520,648" stroke-width="2.8"></path>

  <g stroke-opacity="0.32" stroke-width="3.2">
    <path d="M308,262 C330,278 370,278 392,262"></path>
    <path d="M286,300 C312,344 388,344 414,300"></path>
    <path d="M350,286 L350,352"></path>
    <path d="M288,404 C316,446 384,446 412,404"></path>
    <path d="M350,432 L350,556"></path>
    <path d="M338,556 C346,562 354,562 362,556"></path>
    <path d="M262,644 C300,656 400,656 438,644"></path>
  </g>
</g>

<g id="regions">

  <g id="region-head" class="region">
    <title>Head — racing thoughts, dizziness, feeling detached</title>
    <circle class="target" cx="350" cy="122" r="54"></circle>
    <g class="icon" transform="translate(350,122) scale(1.3)">
      <path d="M-1,-16 C-9,-19 -17,-13 -15,-5 C-20,0 -17,9 -9,11 C-6,17 4,18 8,13 C17,12 20,3 15,-3 C17,-12 8,-19 0,-15"></path>
      <path d="M0,-15 L0,13"></path>
      <path d="M-8,-6 L-2,-3"></path>
      <path d="M8,4 L1,6"></path>
    </g>
    <g class="check" transform="translate(390,162)">
      <circle r="14" fill="#B45309"></circle>
      <path d="M-6,0 L-1.5,5 L6.5,-5" fill="none" stroke="#FFFBEB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  <g id="region-lungs" class="region">
    <title>Lungs — faster breathing</title>
    <circle class="target" cx="352" cy="296" r="48"></circle>
    <g class="icon" transform="translate(352,296) scale(1.25)">
      <path d="M0,-18 L0,-2"></path>
      <path d="M-1,-4 C-11,-6 -18,3 -16,13 C-15,19 -6,19 -4,12 C-1,4 -1,-1 -1,-4 Z"></path>
      <path d="M1,-4 C11,-6 18,3 16,13 C15,19 6,19 4,12 C1,4 1,-1 1,-4 Z"></path>
    </g>
    <g class="check" transform="translate(387,331)">
      <circle r="14" fill="#B45309"></circle>
      <path d="M-6,0 L-1.5,5 L6.5,-5" fill="none" stroke="#FFFBEB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  <g id="region-heart" class="region">
    <title>Heart — beating faster</title>
    <circle class="target" cx="294" cy="380" r="40"></circle>
    <g class="icon" transform="translate(294,380) scale(1.15)">
      <path d="M0,13 C-15,3 -19,-6 -13,-12 C-8,-17 -1,-15 0,-9 C1,-15 8,-17 13,-12 C19,-6 15,3 0,13 Z"></path>
    </g>
    <g class="check" transform="translate(323,409)">
      <circle r="13" fill="#B45309"></circle>
      <path d="M-5.5,0 L-1.5,4.5 L6,-4.5" fill="none" stroke="#FFFBEB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  <g id="region-stomach" class="region">
    <title>Stomach — upset or nauseous</title>
    <circle class="target" cx="352" cy="478" r="46"></circle>
    <g class="icon" transform="translate(352,478) scale(1.25)">
      <path d="M-8,-17 C-6,-9 -8,-5 -11,-1 C-15,6 -12,15 -4,17 C5,19 13,12 13,2 C13,-8 5,-16 -5,-16"></path>
      <path d="M-8,-17 L-1,-19"></path>
    </g>
    <g class="check" transform="translate(385,511)">
      <circle r="14" fill="#B45309"></circle>
      <path d="M-6,0 L-1.5,5 L6.5,-5" fill="none" stroke="#FFFBEB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  <g id="region-body" class="region">
    <title>Body — sweating, tense muscles, shaky or tingly limbs</title>
    <circle class="target" cx="162" cy="616" r="46"></circle>
    <g class="icon" transform="translate(162,616) scale(1.3)">
      <path d="M-3,-20 L-15,2 L-3,2 L-7,20 L15,-4 L3,-4 L7,-20 Z"></path>
    </g>
    <g class="check" transform="translate(195,649)">
      <circle r="14" fill="#B45309"></circle>
      <path d="M-6,0 L-1.5,5 L6.5,-5" fill="none" stroke="#FFFBEB" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

</g>
</svg>
