<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-fog</title>
  <desc>Ground fog through the lower two-thirds, thinning to nothing by the crest. Built as many small discrete banks so a partial reveal inside a small lit circle still reads as fog. Blend: normal (low alpha). Hooks: .fog (+ .fog--l / .fog--r).</desc>
  <defs>
    <radialGradient id="fogThin" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4a4670" stop-opacity="0.6"></stop><stop offset="0.5" stop-color="#332e52" stop-opacity="0.26"></stop><stop offset="1" stop-color="#1b1836" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="fogViolet" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3f3a63" stop-opacity="0.8"></stop><stop offset="0.5" stop-color="#2b2648" stop-opacity="0.36"></stop><stop offset="1" stop-color="#171430" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="fogDeep" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#2e2b4e" stop-opacity="0.75"></stop><stop offset="0.5" stop-color="#1e1c39" stop-opacity="0.32"></stop><stop offset="1" stop-color="#121026" stop-opacity="0"></stop></radialGradient>
  </defs>
