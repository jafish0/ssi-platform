    <ellipse class="wisp wisp--l" cx="1000" cy="300" rx="220" ry="38" fill="url(#wispCream)" opacity="0.47" style="animation-duration:76s,41.8s;animation-delay:-1s,-0.4s"></ellipse>
    <ellipse class="wisp wisp--r" cx="220" cy="430" rx="300" ry="50" fill="url(#wispCream)" opacity="0.50" style="animation-duration:71s,39.1s;animation-delay:-29s,-11.6s"></ellipse>
    <ellipse class="wisp wisp--l" cx="600" cy="450" rx="320" ry="52" fill="url(#wispCream)" opacity="0.42" style="animation-duration:66s,36.3s;animation-delay:-14s,-5.6s"></ellipse>
    <ellipse class="wisp wisp--r" cx="950" cy="420" rx="260" ry="46" fill="url(#wispCream)" opacity="0.43" style="animation-duration:66s,36.3s;animation-delay:-17s,-6.8s"></ellipse>
    <ellipse class="wisp wisp--l" cx="60" cy="620" rx="190" ry="60" fill="url(#wispLav)" opacity="0.45" style="animation-duration:67s,36.9s;animation-delay:-20s,-8.0s"></ellipse>
    <ellipse class="wisp wisp--l" cx="110" cy="860" rx="180" ry="54" fill="url(#wispLav)" opacity="0.37" style="animation-duration:77s,42.4s;animation-delay:-30s,-12.0s"></ellipse>
    <ellipse class="wisp wisp--l" cx="40" cy="1120" rx="170" ry="58" fill="url(#wispLav)" opacity="0.38" style="animation-duration:83s,45.7s;animation-delay:-30s,-12.0s"></ellipse>
    <ellipse class="wisp wisp--l" cx="90" cy="1380" rx="160" ry="52" fill="url(#wispLav)" opacity="0.45" style="animation-duration:68s,37.4s;animation-delay:-30s,-12.0s"></ellipse>
    <ellipse class="wisp wisp--r" cx="1030" cy="560" rx="190" ry="58" fill="url(#wispLav)" opacity="0.36" style="animation-duration:57s,31.4s;animation-delay:-5s,-2.0s"></ellipse>
