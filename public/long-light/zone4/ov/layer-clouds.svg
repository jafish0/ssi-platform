<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>layer-clouds</title>
  <desc>Cloud wisps along the cloud-sea horizon and plateau edges. Blend: screen. Hooks: .wisp (+ .wisp--l / .wisp--r for drift direction).</desc>
  <defs>
    <radialGradient id="wispCream" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff1dc" stop-opacity="0.9"></stop><stop offset="0.55" stop-color="#f6d9c4" stop-opacity="0.35"></stop><stop offset="1" stop-color="#e8c9d6" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="wispLav" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f3e3ee" stop-opacity="0.85"></stop><stop offset="0.55" stop-color="#d9c4e8" stop-opacity="0.32"></stop><stop offset="1" stop-color="#b9a4dc" stop-opacity="0"></stop></radialGradient>
  </defs>
  <g id="layer-clouds">
    <ellipse class="wisp wisp--r" cx="120" cy="330" rx="260" ry="46" fill="url(#wispCream)" opacity="0.32" style="animation-duration:81s,44.6s;animation-delay:-15s,-6.0s"></ellipse>
    <ellipse class="wisp wisp--l" cx="420" cy="300" rx="300" ry="40" fill="url(#wispCream)" opacity="0.39" style="animation-duration:86s,47.3s;animation-delay:-8s,-3.2s"></ellipse>
