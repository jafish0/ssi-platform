<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-exit-glow</title>
  <desc>Warm bloom where the trail leaves the plate between the two gate posts; slow 8s breathe. Blend: screen. Hooks: .exit-glow (+ --b), .exit-core.</desc>
  <defs><radialGradient id="exitGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2d2" stop-opacity="0.9"></stop><stop offset="0.3" stop-color="#ffd48a" stop-opacity="0.42"></stop><stop offset="0.68" stop-color="#e59a5a" stop-opacity="0.14"></stop><stop offset="1" stop-color="#6a5a8a" stop-opacity="0"></stop></radialGradient></defs>
  <g id="layer-exit-glow">
    <ellipse class="exit-glow" cx="778" cy="110" rx="170" ry="120" fill="url(#exitGlow)" opacity="0.42" style="transform-origin:778px 110px"></ellipse>
    <ellipse class="exit-glow exit-glow--b" cx="776" cy="150" rx="96" ry="60" fill="url(#exitGlow)" opacity="0.32" style="transform-origin:776px 150px"></ellipse>
    <ellipse class="exit-core" cx="778" cy="120" rx="36" ry="30" fill="url(#exitGlow)" opacity="0.5" style="transform-origin:778px 120px"></ellipse>
  </g>
</svg>