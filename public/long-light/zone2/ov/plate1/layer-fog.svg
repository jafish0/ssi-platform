<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-fog</title>
  <desc>Very thin low mist at the trail edges, drifting sideways; far lighter than Zone 1. Blend: normal (low alpha). Hooks: .fog (+ .fog--l / .fog--r).</desc>
  <defs><radialGradient id="mist" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8e97c4" stop-opacity="0.7"></stop><stop offset="0.5" stop-color="#5d6598" stop-opacity="0.28"></stop><stop offset="1" stop-color="#2c3162" stop-opacity="0"></stop></radialGradient></defs>
  <g id="layer-fog">
    <ellipse class="fog fog--l" cx="150" cy="1560" rx="200" ry="44" fill="url(#mist)" opacity="0.10" style="transform-origin:150px 1560px;animation-duration:126s,63s;animation-delay:-26s,-9s"></ellipse>
    <ellipse class="fog fog--r" cx="930" cy="1250" rx="170" ry="40" fill="url(#mist)" opacity="0.12" style="transform-origin:930px 1250px;animation-duration:134s,67s;animation-delay:-14s,-4s"></ellipse>
    <ellipse class="fog fog--l" cx="180" cy="1010" rx="170" ry="40" fill="url(#mist)" opacity="0.16" style="transform-origin:180px 1010px;animation-duration:115s,57s;animation-delay:-16s,-5s"></ellipse>
    <ellipse class="fog fog--r" cx="1010" cy="960" rx="160" ry="38" fill="url(#mist)" opacity="0.15" style="transform-origin:1010px 960px;animation-duration:117s,58s;animation-delay:-1s,0s"></ellipse>
    <ellipse class="fog fog--l" cx="140" cy="700" rx="160" ry="36" fill="url(#mist)" opacity="0.16" style="transform-origin:140px 700px;animation-duration:109s,54s;animation-delay:-51s,-17s"></ellipse>
    <ellipse class="fog fog--r" cx="980" cy="560" rx="150" ry="34" fill="url(#mist)" opacity="0.14" style="transform-origin:980px 560px;animation-duration:100s,50s;animation-delay:-24s,-8s"></ellipse>
    <ellipse class="fog fog--l" cx="260" cy="560" rx="150" ry="32" fill="url(#mist)" opacity="0.14" style="transform-origin:260px 560px;animation-duration:101s,50s;animation-delay:-29s,-10s"></ellipse>
    <ellipse class="fog fog--r" cx="1000" cy="1720" rx="190" ry="42" fill="url(#mist)" opacity="0.13" style="transform-origin:1000px 1720px;animation-duration:91s,45s;animation-delay:-52s,-18s"></ellipse>
    <ellipse class="fog fog--l" cx="120" cy="1860" rx="220" ry="44" fill="url(#mist)" opacity="0.11" style="transform-origin:120px 1860px;animation-duration:126s,63s;animation-delay:-65s,-22s"></ellipse>
    <ellipse class="fog fog--r" cx="960" cy="1880" rx="210" ry="42" fill="url(#mist)" opacity="0.12" style="transform-origin:960px 1880px;animation-duration:107s,53s;animation-delay:-31s,-10s"></ellipse>
