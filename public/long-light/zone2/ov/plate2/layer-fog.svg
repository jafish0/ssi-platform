<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-fog</title>
  <desc>Faint mist outside the clearing's stone wall, heaviest at the top-right exit where the Fogline begins. Four friend spots, the fire ring and the trail stay clear. Blend: normal (low alpha). Hooks: .fog (+ .fog--l / .fog--r).</desc>
  <defs>
    <radialGradient id="mist" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8a93c2" stop-opacity="0.7"></stop><stop offset="0.5" stop-color="#58609a" stop-opacity="0.28"></stop><stop offset="1" stop-color="#262c5c" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="mistExit" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#b6c2e6" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#7c88bc" stop-opacity="0.36"></stop><stop offset="1" stop-color="#3a4274" stop-opacity="0"></stop></radialGradient>
  </defs>
