<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-fire</title>
  <desc>Campfire light centred on the flame at 548,758 (ring of stones at 548,800). Fast layered flicker (0.43/0.61/0.87s) over a 5s breathing bloom. Intensity steps with the CSS variable --fire-level (0-4) set on any ancestor: 0 = modest fire, 4 = the whole clearing lit. Blend: screen. Hooks: #fire-core-level, #fire-bloom-level, #fire-wash-level (level-driven wrappers); .fire-flicker (--a/--b/--c), .fire-breathe, .fire-wash.</desc>
  <defs>
    <radialGradient id="fireCore" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff0c4" stop-opacity="0.95"></stop><stop offset="0.3" stop-color="#ffc463" stop-opacity="0.5"></stop><stop offset="0.7" stop-color="#f08a36" stop-opacity="0.14"></stop><stop offset="1" stop-color="#b8582a" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="fireBloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd48a" stop-opacity="0.7"></stop><stop offset="0.35" stop-color="#f5a650" stop-opacity="0.3"></stop><stop offset="0.7" stop-color="#c46e3a" stop-opacity="0.1"></stop><stop offset="1" stop-color="#5a3a4a" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="fireWash" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffcf88" stop-opacity="0.5"></stop><stop offset="0.45" stop-color="#e8964e" stop-opacity="0.24"></stop><stop offset="0.8" stop-color="#9a5a44" stop-opacity="0.06"></stop><stop offset="1" stop-color="#3a2e4a" stop-opacity="0"></stop></radialGradient>
  </defs>
  <g id="layer-fire">
    <g id="fire-wash-level" style="transform-origin:548px 800px">
      <ellipse class="fire-wash" cx="548" cy="800" rx="520" ry="470" fill="url(#fireWash)" style="transform-origin:548px 800px"></ellipse>
    </g>
    <g id="fire-bloom-level" style="transform-origin:548px 800px">
      <ellipse class="fire-breathe" cx="548" cy="800" rx="250" ry="215" fill="url(#fireBloom)" opacity="0.6" style="transform-origin:548px 800px"></ellipse>
    </g>
    <g id="fire-core-level" style="transform-origin:548px 758px">
      <ellipse class="fire-flicker fire-flicker--a" cx="548" cy="772" rx="112" ry="100" fill="url(#fireCore)" opacity="0.55" style="transform-origin:548px 788px"></ellipse>
      <ellipse class="fire-flicker fire-flicker--b" cx="552" cy="764" rx="70" ry="74" fill="url(#fireCore)" opacity="0.5" style="transform-origin:548px 788px"></ellipse>
      <ellipse class="fire-flicker fire-flicker--c" cx="545" cy="758" rx="34" ry="44" fill="url(#fireCore)" opacity="0.6" style="transform-origin:548px 784px"></ellipse>
    </g>
  </g>
</svg>