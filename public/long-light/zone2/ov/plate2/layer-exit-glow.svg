<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-exit-glow</title>
  <desc>Cool pale bloom at the top-right exit between the two rocks (around 905,300). Dim by default; add .is-open to the svg or any ancestor to brighten it once all four friends are helped. Blend: screen. Hooks: #exit-level (open/closed wrapper), .exit-glow (+ --b), .exit-core.</desc>
  <defs><radialGradient id="exitGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#eef4ff" stop-opacity="0.9"></stop><stop offset="0.3" stop-color="#c6d4f4" stop-opacity="0.42"></stop><stop offset="0.68" stop-color="#8e9fd4" stop-opacity="0.14"></stop><stop offset="1" stop-color="#4a5690" stop-opacity="0"></stop></radialGradient></defs>
  <g id="layer-exit-glow">
    <g id="exit-level" style="transform-origin:905px 300px">
      <ellipse class="exit-glow" cx="905" cy="290" rx="190" ry="140" fill="url(#exitGlow)" opacity="0.42" style="transform-origin:905px 290px"></ellipse>
      <ellipse class="exit-glow exit-glow--b" cx="915" cy="330" rx="110" ry="78" fill="url(#exitGlow)" opacity="0.32" style="transform-origin:915px 330px"></ellipse>
      <ellipse class="exit-core" cx="910" cy="300" rx="44" ry="36" fill="url(#exitGlow)" opacity="0.5" style="transform-origin:910px 300px"></ellipse>
    </g>
  </g>
</svg>