<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-mist-top</title>
  <desc>Heavier mist pooled on the plateau and around the bridge at the top of the plate, low and slow. Blend: normal. Hooks: .mist (+ .mist--l / .mist--r).</desc>
  <defs>
    <radialGradient id="mistTop" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#d6dbea" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#aeb6d0" stop-opacity="0.4"></stop><stop offset="1" stop-color="#8490b6" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="mistFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8cfe2" stop-opacity="0.5"></stop><stop offset="0.7" stop-color="#a7b0cc" stop-opacity="0.2"></stop><stop offset="1" stop-color="#8a95b8" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g id="layer-mist-top">
    <rect class="mist-floor" x="0" y="0" width="1080" height="470" fill="url(#mistFloor)" opacity="0.6"></rect>
    <ellipse class="mist mist--l" cx="140" cy="300" rx="300" ry="80" fill="url(#mistTop)" opacity="0.42" style="transform-origin:140px 300px;animation-duration:116s,58s;animation-delay:-22s,-7s"></ellipse>
    <ellipse class="mist mist--r" cx="420" cy="330" rx="320" ry="76" fill="url(#mistTop)" opacity="0.49" style="transform-origin:420px 330px;animation-duration:124s,62s;animation-delay:-12s,-4s"></ellipse>
    <ellipse class="mist mist--l" cx="700" cy="300" rx="320" ry="74" fill="url(#mistTop)" opacity="0.60" style="transform-origin:700px 300px;animation-duration:105s,52s;animation-delay:-13s,-4s"></ellipse>
    <ellipse class="mist mist--r" cx="960" cy="330" rx="300" ry="80" fill="url(#mistTop)" opacity="0.58" style="transform-origin:960px 330px;animation-duration:107s,53s;animation-delay:-1s,0s"></ellipse>
    <ellipse class="mist mist--l" cx="260" cy="200" rx="340" ry="90" fill="url(#mistTop)" opacity="0.62" style="transform-origin:260px 200px;animation-duration:99s,49s;animation-delay:-44s,-15s"></ellipse>
    <ellipse class="mist mist--r" cx="640" cy="180" rx="360" ry="86" fill="url(#mistTop)" opacity="0.53" style="transform-origin:640px 180px;animation-duration:90s,45s;animation-delay:-20s,-7s"></ellipse>
    <ellipse class="mist mist--l" cx="980" cy="170" rx="300" ry="84" fill="url(#mistTop)" opacity="0.54" style="transform-origin:980px 170px;animation-duration:91s,45s;animation-delay:-25s,-8s"></ellipse>
    <ellipse class="mist mist--r" cx="520" cy="390" rx="300" ry="56" fill="url(#mistTop)" opacity="0.50" style="transform-origin:520px 390px;animation-duration:81s,40s;animation-delay:-44s,-15s"></ellipse>
    <ellipse class="mist mist--l" cx="120" cy="110" rx="300" ry="90" fill="url(#mistTop)" opacity="0.47" style="transform-origin:120px 110px;animation-duration:116s,58s;animation-delay:-56s,-19s"></ellipse>
    <ellipse class="mist mist--r" cx="820" cy="80" rx="320" ry="86" fill="url(#mistTop)" opacity="0.47" style="transform-origin:820px 80px;animation-duration:97s,48s;animation-delay:-27s,-9s"></ellipse>
    <ellipse class="mist mist--l" cx="460" cy="60" rx="340" ry="80" fill="url(#mistTop)" opacity="0.43" style="transform-origin:460px 60px;animation-duration:101s,50s;animation-delay:-30s,-10s"></ellipse>
  </g>
</svg>