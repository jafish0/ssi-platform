<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-lamp-glow</title>
  <desc>Warm blooms on the two lamp posts at the bottom of the plate (lanterns at 267,1570 and 810,1570) with a soft ground pool under each — the last warm light before the mist. Blend: screen. Hooks: .lamp-bloom, .lamp-pool, .lamp-core.</desc>
  <defs>
    <radialGradient id="lampBloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe6b0" stop-opacity="0.95"></stop><stop offset="0.3" stop-color="#ffc062" stop-opacity="0.42"></stop><stop offset="0.7" stop-color="#d98a3e" stop-opacity="0.12"></stop><stop offset="1" stop-color="#5a4a6e" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="lampPool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffcf82" stop-opacity="0.7"></stop><stop offset="0.5" stop-color="#e09a50" stop-opacity="0.22"></stop><stop offset="1" stop-color="#7a5a4a" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="lampCore" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d6" stop-opacity="1"></stop><stop offset="0.5" stop-color="#ffd08a" stop-opacity="0.6"></stop><stop offset="1" stop-color="#ffb060" stop-opacity="0"></stop></radialGradient>
  </defs>
  <g id="layer-lamp-glow">
    <g class="lamp-unit">
      <ellipse class="lamp-bloom" cx="267" cy="1570" rx="150" ry="140" fill="url(#lampBloom)" opacity="0.42" style="transform-origin:267px 1570px;animation-duration:5.1s;animation-delay:0s"></ellipse>
      <ellipse class="lamp-pool" cx="267" cy="1690" rx="170" ry="70" fill="url(#lampPool)" opacity="0.32" style="transform-origin:267px 1690px;animation-duration:5.1s;animation-delay:0s"></ellipse>
      <circle class="lamp-core" cx="267" cy="1570" r="22" fill="url(#lampCore)" opacity="0.8" style="transform-origin:267px 1570px;animation-duration:2.7s;animation-delay:-.4s"></circle>
    </g>
    <g class="lamp-unit">
      <ellipse class="lamp-bloom" cx="810" cy="1570" rx="150" ry="140" fill="url(#lampBloom)" opacity="0.42" style="transform-origin:810px 1570px;animation-duration:6.2s;animation-delay:-2.4s"></ellipse>
      <ellipse class="lamp-pool" cx="810" cy="1690" rx="170" ry="70" fill="url(#lampPool)" opacity="0.32" style="transform-origin:810px 1690px;animation-duration:6.2s;animation-delay:-2.4s"></ellipse>
      <circle class="lamp-core" cx="810" cy="1570" r="22" fill="url(#lampCore)" opacity="0.8" style="transform-origin:810px 1570px;animation-duration:3.1s;animation-delay:-1.2s"></circle>
    </g>
  </g>
</svg>