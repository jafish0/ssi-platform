<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-beyond</title>
  <desc>Slow warm pulse on the far high ground above the mist — the sunlit ledge you are headed for. Blend: screen. Hooks: .beyond-glow (8s breathe), .beyond-band, .beyond-ledge.</desc>
  <defs>
    <radialGradient id="beyondGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff8e6" stop-opacity="0.85"></stop><stop offset="0.3" stop-color="#ffdf9e" stop-opacity="0.4"></stop><stop offset="0.68" stop-color="#f2a98e" stop-opacity="0.14"></stop><stop offset="1" stop-color="#c79ad0" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="beyondBand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffeec6" stop-opacity="0.42"></stop><stop offset="0.6" stop-color="#e6c8e8" stop-opacity="0.16"></stop><stop offset="1" stop-color="#b9a4dc" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g id="layer-beyond">
    <ellipse class="beyond-glow" cx="700" cy="60" rx="300" ry="150" fill="url(#beyondGlow)" opacity="0.45" style="transform-origin:700px 60px"></ellipse>
    <ellipse class="beyond-glow beyond-glow--b" cx="820" cy="180" rx="210" ry="105" fill="url(#beyondGlow)" opacity="0.3" style="transform-origin:820px 180px"></ellipse>
    <ellipse class="beyond-ledge" cx="860" cy="205" rx="130" ry="46" fill="url(#beyondGlow)" opacity="0.26" style="transform-origin:860px 205px"></ellipse>
    <rect class="beyond-band" x="330" y="0" width="740" height="290" fill="url(#beyondBand)" opacity="0.3"></rect>
  </g>
</svg>