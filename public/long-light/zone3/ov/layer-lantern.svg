      <ellipse class="lantern-bloom" cx="699" cy="818" rx="108" ry="93" fill="url(#lampBloom)" opacity="0.34" style="transform-origin:699px 818px;animation-duration:5.5s;animation-delay:-5.4s"></ellipse>
      <circle class="lantern-core" cx="699" cy="818" r="13.8" fill="url(#lampCore)" opacity="0.85" style="transform-origin:699px 818px;animation-duration:3.29s;animation-delay:-2.95s"></circle>
    </g>
    <g class="lantern-unit">
