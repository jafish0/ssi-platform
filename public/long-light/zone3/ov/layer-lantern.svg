      <circle class="lantern-core lantern-core--b" cx="816" cy="1040" r="14.9" fill="url(#lampCore)" opacity="0.85" style="transform-origin:816px 1040px;animation-duration:2.97s;animation-delay:-1.37s"></circle>
    </g>
    <g class="lantern-unit">
