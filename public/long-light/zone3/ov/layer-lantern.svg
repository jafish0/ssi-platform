<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-lantern</title>
  <desc>Flicker/bloom on the rest-spot lanterns, the path lanterns, and the far bridge-side lantern. Blend: screen. Hooks: .lantern-bloom (+ --b), .lantern-core (+ --b).</desc>
  <defs>
    <radialGradient id="lampBloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff4d8" stop-opacity="0.95"></stop><stop offset="0.28" stop-color="#ffd995" stop-opacity="0.44"></stop><stop offset="0.65" stop-color="#f0a97e" stop-opacity="0.14"></stop><stop offset="1" stop-color="#d69ac0" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="lampCore" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffdf4" stop-opacity="1"></stop><stop offset="0.5" stop-color="#ffe7ae" stop-opacity="0.7"></stop><stop offset="1" stop-color="#ffcf82" stop-opacity="0"></stop></radialGradient>
  </defs>
  <g id="layer-lantern">
