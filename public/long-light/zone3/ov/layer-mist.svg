<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-mist</title>
  <desc>Layered mist banks on both flanks, the far horizon, and pooled in the chasm beneath the bridge. Blend: screen. Hooks: .mist (+ .mist--l / .mist--r for drift direction).</desc>
  <defs>
    <radialGradient id="mistLav" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8dcfb" stop-opacity="0.9"></stop><stop offset="0.5" stop-color="#c8b6ee" stop-opacity="0.38"></stop><stop offset="1" stop-color="#a191dc" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="mistBlue" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#dcd8f8" stop-opacity="0.82"></stop><stop offset="0.5" stop-color="#9f9ede" stop-opacity="0.34"></stop><stop offset="1" stop-color="#6f74b8" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="mistPool" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#f2e6f8" stop-opacity="0.9"></stop><stop offset="0.45" stop-color="#cdb9ee" stop-opacity="0.4"></stop><stop offset="1" stop-color="#9c8ad4" stop-opacity="0"></stop></radialGradient>
  </defs>
  <g id="layer-mist">
    <ellipse class="mist mist--l" cx="240" cy="210" rx="320" ry="70" fill="url(#mistLav)" opacity="0.30" style="transform-origin:240px 210px;animation-duration:117s,59s;animation-delay:-22s,-8s"></ellipse>
    <ellipse class="mist mist--r" cx="620" cy="150" rx="360" ry="58" fill="url(#mistLav)" opacity="0.35" style="transform-origin:620px 150px;animation-duration:123s,62s;animation-delay:-12s,-4s"></ellipse>
    <ellipse class="mist mist--l" cx="930" cy="220" rx="300" ry="66" fill="url(#mistLav)" opacity="0.43" style="transform-origin:930px 220px;animation-duration:108s,54s;animation-delay:-13s,-5s"></ellipse>
    <ellipse class="mist mist--r" cx="400" cy="320" rx="300" ry="64" fill="url(#mistLav)" opacity="0.42" style="transform-origin:400px 320px;animation-duration:109s,55s;animation-delay:-1s,-0s"></ellipse>
    <ellipse class="mist mist--l" cx="860" cy="360" rx="280" ry="60" fill="url(#mistLav)" opacity="0.44" style="transform-origin:860px 360px;animation-duration:103s,52s;animation-delay:-44s,-15s"></ellipse>
