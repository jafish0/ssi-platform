    <ellipse class="mist mist--l" cx="140" cy="860" rx="210" ry="78" fill="url(#mistBlue)" opacity="0.37" style="transform-origin:140px 860px;animation-duration:117s,59s;animation-delay:-44s,-15s"></ellipse>
    <ellipse class="mist mist--l" cx="70" cy="1060" rx="190" ry="70" fill="url(#mistBlue)" opacity="0.42" style="transform-origin:70px 1060px;animation-duration:98s,49s;animation-delay:-45s,-16s"></ellipse>
    <ellipse class="mist mist--r" cx="980" cy="480" rx="250" ry="90" fill="url(#mistBlue)" opacity="0.35" style="transform-origin:980px 480px;animation-duration:82s,41s;animation-delay:-8s,-3s"></ellipse>
