<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-passage-glow</title>
  <desc>Breathing pale glow inside the top passage (slot around x 660-765, y 0-260). Kept soft so an in-engine Spark light reads over it. Blend: screen. Hooks: .passage-glow (9s breathe), .passage-shaft, .passage-core.</desc>
  <defs>
    <radialGradient id="passGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e6f0ff" stop-opacity="0.8"></stop><stop offset="0.3" stop-color="#cfe0fb" stop-opacity="0.34"></stop><stop offset="0.68" stop-color="#a9b6e8" stop-opacity="0.12"></stop><stop offset="1" stop-color="#6f76b8" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="passShaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe9ff" stop-opacity="0.34"></stop><stop offset="0.55" stop-color="#b9c6ee" stop-opacity="0.14"></stop><stop offset="1" stop-color="#8d93cc" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g id="layer-passage-glow">
    <ellipse class="passage-glow" cx="712" cy="118" rx="132" ry="150" fill="url(#passGlow)" opacity="0.4" style="transform-origin:712px 118px"></ellipse>
    <ellipse class="passage-glow passage-glow--b" cx="716" cy="212" rx="96" ry="98" fill="url(#passGlow)" opacity="0.28" style="transform-origin:716px 212px"></ellipse>
    <path class="passage-shaft" d="M668 0 L762 0 L742 300 L692 300 Z" fill="url(#passShaft)" opacity="0.26"></path>
    <ellipse class="passage-core" cx="712" cy="96" rx="34" ry="46" fill="url(#passGlow)" opacity="0.5" style="transform-origin:712px 96px"></ellipse>
  </g>
</svg>