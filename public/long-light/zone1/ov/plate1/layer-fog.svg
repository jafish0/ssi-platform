<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-fog</title>
  <desc>Low near-black-violet ground fog across the lower half, pooling in the rock hollows on both flanks. Blend: normal (low alpha). Hooks: .fog (+ .fog--l / .fog--r for drift direction).</desc>
  <defs>
    <radialGradient id="fogViolet" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b3358" stop-opacity="0.85"></stop><stop offset="0.5" stop-color="#2a2444" stop-opacity="0.4"></stop><stop offset="1" stop-color="#171430" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="fogDeep" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#2e2b4e" stop-opacity="0.8"></stop><stop offset="0.5" stop-color="#1e1c39" stop-opacity="0.36"></stop><stop offset="1" stop-color="#121026" stop-opacity="0"></stop></radialGradient>
  </defs>
