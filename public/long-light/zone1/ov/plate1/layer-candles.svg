<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-candles</title>
  <desc>Flicker/bloom on each candle along the path, centred on the painted flames and scaled by depth. Blend: screen. Hooks: .candle-bloom (+ --b), .candle-flame (+ --b).</desc>
  <defs>
    <radialGradient id="candBloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd79a" stop-opacity="0.9"></stop><stop offset="0.3" stop-color="#ffab5c" stop-opacity="0.38"></stop><stop offset="0.7" stop-color="#c46a3c" stop-opacity="0.12"></stop><stop offset="1" stop-color="#6a3a52" stop-opacity="0"></stop></radialGradient>
    <radialGradient id="candCore" cx="0.5" cy="0.55" r="0.5"><stop offset="0" stop-color="#ffd18a" stop-opacity="0.95"></stop><stop offset="0.45" stop-color="#ffb163" stop-opacity="0.6"></stop><stop offset="1" stop-color="#ff9c4e" stop-opacity="0"></stop></radialGradient>
  </defs>
