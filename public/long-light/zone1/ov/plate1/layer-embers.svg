<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-embers</title>
  <desc>Twelve tiny dark-orange embers rising slowly along the path edges, blinking faintly. Blend: screen. Hooks: .ember (+ .ember--b), .ember-core, .ember-glow.</desc>
