<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-steps-glow</title>
  <desc>Breathing warm glow at the head of the stone steps (painted light at 784,120) — the exit that unlocks later; a touch brighter than plate 1's passage glow. Blend: screen. Hooks: .steps-glow (8s breathe), .steps-spill, .steps-core.</desc>
  <defs>
    <radialGradient id="stepsGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2d4" stop-opacity="0.9"></stop><stop offset="0.28" stop-color="#ffd18f" stop-opacity="0.44"></stop><stop offset="0.66" stop-color="#e09a63" stop-opacity="0.15"></stop><stop offset="1" stop-color="#8a5f7a" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="stepsSpill" x1="0.5" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#ffe0ad" stop-opacity="0.34"></stop><stop offset="0.6" stop-color="#d8a887" stop-opacity="0.12"></stop><stop offset="1" stop-color="#8f7aa8" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g id="layer-steps-glow">
    <ellipse class="steps-glow" cx="784" cy="120" rx="128" ry="118" fill="url(#stepsGlow)" opacity="0.5" style="transform-origin:784px 120px"></ellipse>
    <ellipse class="steps-glow steps-glow--b" cx="776" cy="192" rx="92" ry="80" fill="url(#stepsGlow)" opacity="0.34" style="transform-origin:776px 192px"></ellipse>
    <path class="steps-spill" d="M731 106 L837 106 L795 440 L695 440 Z" fill="url(#stepsSpill)" opacity="0.28"></path>
    <ellipse class="steps-core" cx="784" cy="114" rx="30" ry="34" fill="url(#stepsGlow)" opacity="0.55" style="transform-origin:784px 114px"></ellipse>
  </g>
</svg>