<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>layer-pool</title>
  <desc>Near-still mirror pool: two blurred ripple rings, soft gradient-faded glints, and a hair of shimmer on the painted candle reflections. Blend: screen. Hooks: .pool-ring (18s expand), .pool-glint, .pool-reflect.</desc>
  <defs>
    <filter id="soften" x="-60%" y="-200%" width="220%" height="500%"><feGaussianBlur stdDeviation="2.6"></feGaussianBlur></filter>
    <radialGradient id="poolSheen" cx="0.5" cy="0.45" r="0.55"><stop offset="0" stop-color="#b9c8e6" stop-opacity="0.14"></stop><stop offset="1" stop-color="#6d7ab0" stop-opacity="0"></stop></radialGradient>
    <linearGradient id="ringFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cbd8f0" stop-opacity="0"></stop><stop offset="0.3" stop-color="#cbd8f0" stop-opacity="0.85"></stop><stop offset="0.7" stop-color="#cbd8f0" stop-opacity="0.85"></stop><stop offset="1" stop-color="#cbd8f0" stop-opacity="0"></stop></linearGradient>
    <linearGradient id="glintFade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d8e2f6" stop-opacity="0"></stop><stop offset="0.5" stop-color="#d8e2f6" stop-opacity="0.9"></stop><stop offset="1" stop-color="#d8e2f6" stop-opacity="0"></stop></linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcd8c" stop-opacity="0.8"></stop><stop offset="1" stop-color="#ff9c4e" stop-opacity="0"></stop></linearGradient>
  </defs>
  <g id="layer-pool">
    <ellipse cx="550" cy="700" rx="292" ry="98" fill="url(#poolSheen)" opacity="0.5"></ellipse>
    <ellipse class="pool-ring" cx="520" cy="700" rx="41" ry="13" fill="none" stroke="url(#ringFade)" stroke-width="2.4" opacity="0.08" filter="url(#soften)" style="transform-origin:520px 700px;animation-delay:0s"></ellipse>
    <ellipse class="pool-ring" cx="660" cy="690" rx="34" ry="10" fill="none" stroke="url(#ringFade)" stroke-width="2.4" opacity="0.08" filter="url(#soften)" style="transform-origin:660px 690px;animation-delay:-9s"></ellipse>
    <rect class="pool-glint" x="356" y="659" width="48" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:380px 660px;animation-duration:13.4s;animation-delay:-8.2s"></rect>
    <rect class="pool-glint" x="446" y="699" width="48" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:470px 700px;animation-duration:10.7s;animation-delay:-3.6s"></rect>
    <rect class="pool-glint" x="532" y="669" width="56" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:560px 670px;animation-duration:15.1s;animation-delay:-11.5s"></rect>
    <rect class="pool-glint" x="620" y="711" width="60" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:650px 712px;animation-duration:9.8s;animation-delay:-6.1s"></rect>
    <rect class="pool-glint" x="712" y="689" width="56" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:740px 690px;animation-duration:12.3s;animation-delay:-13.1s"></rect>
    <rect class="pool-glint" x="478" y="757" width="44" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:500px 758px;animation-duration:14.6s;animation-delay:-2.4s"></rect>
    <rect class="pool-glint" x="594" y="769" width="52" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:620px 770px;animation-duration:11.2s;animation-delay:-9.7s"></rect>
    <rect class="pool-glint" x="272" y="689" width="56" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:300px 690px;animation-duration:16.0s;animation-delay:-5.3s"></rect>
    <rect class="pool-glint" x="774" y="699" width="52" height="2" rx="1" fill="url(#glintFade)" opacity="0.1" filter="url(#soften)" style="transform-origin:800px 700px;animation-duration:10.1s;animation-delay:-12.6s"></rect>
    <ellipse class="pool-reflect" cx="469" cy="648" rx="3" ry="34" fill="url(#reflect)" opacity="0.2" filter="url(#soften)" style="transform-origin:469px 648px;animation-duration:9.4s;animation-delay:-4.1s"></ellipse>
    <ellipse class="pool-reflect" cx="728" cy="645" rx="3" ry="34" fill="url(#reflect)" opacity="0.2" filter="url(#soften)" style="transform-origin:728px 645px;animation-duration:7.8s;animation-delay:-7.2s"></ellipse>
    <ellipse class="pool-reflect" cx="618" cy="649" rx="3" ry="34" fill="url(#reflect)" opacity="0.2" filter="url(#soften)" style="transform-origin:618px 649px;animation-duration:10.6s;animation-delay:-2.8s"></ellipse>
  </g>
</svg>