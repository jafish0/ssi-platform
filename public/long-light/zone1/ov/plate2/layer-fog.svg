  <title>layer-fog</title>
  <desc>Low ground fog, thinner than plate 1 for this more open cavern; flank hollows plus faint veils skirting the pool basin. Blend: normal (low alpha). Hooks: .fog (+ .fog--l / .fog--r).</desc>
